<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>QnA 답변 등록 알림</title>
</head>

<body style="margin: 0; padding: 0; background-color: #f5f5f5; font-family: 'Malgun Gothic', 'sans-serif';">

	<table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f5f5f5; height: 100vh;">
		<tr>
			<td align="center" valign="middle">

				<table border="0" cellpadding="0" cellspacing="0" width="600"
					style="background-color: #ffffff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); overflow: hidden; max-width: 600px; width: 100%;">

					<tr>
						<td align="center" style="padding: 40px 0;">
							<img src="https://i.imgur.com/kYr3Hf5.png" alt="Rendezvous" width="120"
								style="display: block; width: 120px; height: auto; border: 0;" />
						</td>
					</tr>

					<tr>
						<td align="center" style="padding: 0 40px 60px 40px;">

							<div
								style="width: 80px; height: 80px; background-color: #EE4B6F; border-radius: 50%; margin: 0 auto 30px auto; text-align: center; line-height: 80px;">
								<span style="font-size: 40px; color: white;">✓</span>
							</div>

							<h1
								style="font-size: 26px; color: #333333; margin: 0 0 10px 0; letter-spacing: -1px; word-break: keep-all;">
								문의하신 내용에 대한<br>답변이 등록되었습니다.
							</h1>

							<p style="font-size: 16px; color: #666666; margin: 0 0 40px 0;">
								랑데뷰를 이용해 주셔서 감사합니다.</p>

							<div style="border-bottom: 2px solid #f0f0f0; margin-bottom: 30px; width: 100%;"></div>

							<div style="text-align: left; width: 100%;">

								<div
									style="background-color: #f9f9f9; padding: 20px; border-radius: 12px; margin-bottom: 25px;">
									<p style="margin: 0 0 8px 0; font-size: 13px; color: #888; font-weight: bold;">문의
										제목</p>

									<p th:text="${title}"
										style="margin: 0; font-size: 16px; color: #333; font-weight: bold; line-height: 1.4; word-break: break-all; word-wrap: break-word; white-space: normal;">
										여기에 질문 제목이 들어갑니다.</p>
								</div>

								<div style="padding: 0 5px; margin-bottom: 40px;">
									<p style="margin: 0 0 15px 0; font-size: 14px; color: #EE4B6F; font-weight: bold;">
										관리자
										답변</p>

									<div th:utext="${content}"
										style="font-size: 15px; color: #444; line-height: 1.8; white-space: pre-wrap; word-break: break-all; word-wrap: break-word; overflow-wrap: break-word; width: 100%;">
										답변 내용이 이곳에 표시됩니다.</div>
								</div>

							</div>

							<div>
								<a href="http://localhost:5173" target="_blank"
									style="background-color: #EE4B6F; color: #ffffff; text-decoration: none; padding: 15px 50px; font-size: 16px; font-weight: bold; border-radius: 50px; display: inline-block; border: 1px solid #EE4B6F;">
									홈페이지 바로가기 </a>
							</div>

						</td>
					</tr>
				</table>
			</td>
		</tr>
	</table>

</body>

</html>
