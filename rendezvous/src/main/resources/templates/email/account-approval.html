<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>회원가입 승인 완료</title>
</head>
<body
	style="margin: 0; padding: 0; background-color: #f5f5f5; font-family: 'Malgun Gothic', 'sans-serif';">

	<table border="0" cellpadding="0" cellspacing="0" width="100%"
		style="background-color: #f5f5f5; height: 100vh;">
		<tr>
			<td align="center" valign="middle">

				<table border="0" cellpadding="0" cellspacing="0" width="600"
					style="background-color: #ffffff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); overflow: hidden;">

					<tr>
						<td align="center" style="padding: 40px 0;"><img
							src="cid:logo" alt="Rendezvous" width="120"
							style="display: block; width: 120px; height: auto; border: 0;" />
						</td>
					</tr>

					<tr>
						<td align="center" style="padding: 0 40px 60px 40px;">

							<div
								style="width: 80px; height: 80px; background-color: #EE4B6F; border-radius: 50%; margin: 0 auto 30px auto; text-align: center; line-height: 80px;">
								<span style="font-size: 40px; color: white;">✓</span>
							</div>

							<h1
								style="font-size: 28px; color: #333333; margin: 0 0 15px 0; letter-spacing: -1px;">
								가입 승인이 완료되었습니다!</h1>

							<div
								style="font-size: 16px; color: #666666; margin: 0 0 40px 0; line-height: 1.6;">
								<p th:utext="${message}" style="margin: 0;">
									Rendezvous의 회원이 되신 것을 환영합니다.<br /> 이제 서비스를 자유롭게 이용하실 수 있습니다.
								</p>
							</div>

							<div>
								<a href="http://localhost:5173" target="_blank"
									style="background-color: #EE4B6F; color: #ffffff; text-decoration: none; padding: 15px 50px; font-size: 18px; font-weight: bold; border-radius: 50px; display: inline-block; border: 1px solid #EE4B6F;">
									로그인 하러 가기 </a>
							</div>

						</td>
					</tr>
				</table>
			</td>
		</tr>
	</table>

</body>
</html>
